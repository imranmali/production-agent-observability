global:
  # 5s keeps the local canary drill short. Production: 15s-30s.
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    environment: local

rule_files:
  - rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: agent
    static_configs:
      - targets: [agent-stable:8080, agent-canary:8080]
  - job_name: traefik
    static_configs:
      - targets: [traefik:8082]
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8888]
  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
