apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: support-agent
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  ingressClassName: nginx
  rules:
    - host: agent.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: support-agent-stable
                port: { name: http }
