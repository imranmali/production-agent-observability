apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: support-agent
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: support-agent
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      relabelings:
        # Argo Rollouts labels stable and canary pods with different hashes;
        # the canary analysis compares the two by this label.
        - sourceLabels: [__meta_kubernetes_pod_label_rollouts_pod_template_hash]
          targetLabel: pod_template_hash
