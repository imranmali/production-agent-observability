# GENERATED by scripts/gen_k8s_rules.py from deploy/prometheus/rules/ - do not edit.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: support-agent
  labels:
    release: kube-prometheus-stack
spec:
  groups:
  - name: agent-loops
    rules:
    - alert: AgentLoopDetected
      expr: sum by (track, release) (increase(agent_guardrail_trips_total{guardrail="loop_detected"}[10m])) > 0
      labels:
        severity: info
      annotations:
        summary: Loop guardrail tripped on {{ $labels.track }} ({{ $labels.release }})
        description: '{{ $value | humanize }} request(s) in the last 10m were stopped for repeating identical tool calls.'
        runbook_url: docs/RUNBOOK.md#agentloopdetected
    - alert: AgentLoopRateHigh
      expr: agent:loop_ratio:rate5m > 0.02 and agent:requests:rate5m > 0.05
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: '{{ $value | humanizePercentage }} of {{ $labels.track }} requests are looping'
        description: More than 2% of requests on {{ $labels.release }} hit the loop detector for 2m. Usually a prompt or tool-schema regression; roll back the release.
        runbook_url: docs/RUNBOOK.md#agentloopratehigh
    - alert: AgentStepBudgetExhausted
      expr: agent:max_steps_ratio:rate5m > 0.05 and agent:requests:rate5m > 0.05
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: '{{ $value | humanizePercentage }} of {{ $labels.track }} requests run out of steps'
        runbook_url: docs/RUNBOOK.md#agentstepbudgetexhausted
  - name: agent-failures
    rules:
    - alert: AgentFailureRateHigh
      expr: agent:failure_ratio:rate5m > 0.05 and agent:requests:rate5m > 0.05
      for: 3m
      labels:
        severity: critical
      annotations:
        summary: '{{ $value | humanizePercentage }} of {{ $labels.track }} requests fail'
        description: Non-success outcomes (guardrail trips, provider errors, refusals, exceptions) above 5% for 3m on {{ $labels.release }}.
        runbook_url: docs/RUNBOOK.md#agentfailureratehigh
    - alert: AgentErrorBudgetFastBurn
      expr: agent:slo_error_ratio:rate1h > (14.4 * 0.01) and agent:slo_error_ratio:rate5m > (14.4 * 0.01)
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: Burning the 30-day error budget 14x too fast
        description: At this rate the 99% availability SLO's budget is gone in about 2 days.
        runbook_url: docs/RUNBOOK.md#agenterrorbudgetfastburn
    - alert: AgentErrorBudgetSlowBurn
      expr: agent:slo_error_ratio:rate6h > (6 * 0.01) and agent:slo_error_ratio:rate30m > (6 * 0.01)
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: Burning the 30-day error budget 6x too fast
        runbook_url: docs/RUNBOOK.md#agenterrorbudgetslowburn
    - alert: AgentLLMProviderErrors
      expr: agent:llm_error_ratio:rate5m > 0.10
      for: 3m
      labels:
        severity: critical
      annotations:
        summary: '{{ $value | humanizePercentage }} of model API calls fail on {{ $labels.track }}'
        description: Errors after the SDK's own retries. Check status.anthropic.com, rate limits, and the API key.
        runbook_url: docs/RUNBOOK.md#agentllmprovidererrors
    - alert: AgentTargetDown
      expr: up{job="agent"} == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: Agent instance {{ $labels.instance }} is down
        runbook_url: docs/RUNBOOK.md#agenttargetdown
  - name: agent-latency-cost
    rules:
    - alert: AgentLatencyP95High
      expr: agent:latency_seconds:p95_5m > 20 and agent:requests:rate5m > 0.05
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: p95 latency {{ $value | humanizeDuration }} on {{ $labels.track }}
        runbook_url: docs/RUNBOOK.md#agentlatencyp95high
    - alert: AgentCostBurnHigh
      expr: sum(rate(agent_llm_cost_usd_total[15m])) * 3600 > 5
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: Model spend running at ${{ $value | printf "%.2f" }}/hour (budget $5/hour)
        runbook_url: docs/RUNBOOK.md#agentcostburnhigh
    - alert: AgentUnpricedModel
      expr: sum by (model) (increase(agent_unpriced_model_calls_total[15m])) > 0
      labels:
        severity: warning
      annotations:
        summary: Calls to {{ $labels.model }}, which has no price in agent/pricing.py
        description: Cost dashboards under-report until the price table is updated.
        runbook_url: docs/RUNBOOK.md#agentunpricedmodel
  - name: agent-sli
    rules:
    - record: agent:requests:rate5m
      expr: sum by (track, release) (rate(agent_requests_total[5m]))
    - record: agent:failures:rate5m
      expr: "sum by (track, release) (rate(agent_requests_total{outcome!=\"success\"}[5m]))\n  or (agent:requests:rate5m * 0)\n"
    - record: agent:failure_ratio:rate5m
      expr: agent:failures:rate5m / agent:requests:rate5m
    - record: agent:loop_ratio:rate5m
      expr: "(sum by (track, release) (rate(agent_guardrail_trips_total{guardrail=\"loop_detected\"}[5m]))\n  or (agent:requests:rate5m * 0))\n  / agent:requests:rate5m\n"
    - record: agent:max_steps_ratio:rate5m
      expr: "(sum by (track, release) (rate(agent_guardrail_trips_total{guardrail=\"max_steps\"}[5m]))\n  or (agent:requests:rate5m * 0))\n  / agent:requests:rate5m\n"
    - record: agent:latency_seconds:p50_5m
      expr: histogram_quantile(0.50, sum by (track, release, le) (rate(agent_request_duration_seconds_bucket[5m])))
    - record: agent:latency_seconds:p95_5m
      expr: histogram_quantile(0.95, sum by (track, release, le) (rate(agent_request_duration_seconds_bucket[5m])))
    - record: agent:latency_seconds:p99_5m
      expr: histogram_quantile(0.99, sum by (track, release, le) (rate(agent_request_duration_seconds_bucket[5m])))
    - record: agent:cost_usd:rate5m
      expr: sum by (track, release) (rate(agent_llm_cost_usd_total[5m]))
    - record: agent:cost_per_request_usd:rate5m
      expr: agent:cost_usd:rate5m / agent:requests:rate5m
    - record: agent:steps_per_request:avg5m
      expr: "sum by (track, release) (rate(agent_steps_per_request_sum[5m]))\n  / sum by (track, release) (rate(agent_steps_per_request_count[5m]))\n"
    - record: agent:llm_error_ratio:rate5m
      expr: "sum by (track, release) (rate(agent_llm_requests_total{status!=\"ok\"}[5m]))\n  / sum by (track, release) (rate(agent_llm_requests_total[5m]))\n"
  - name: agent-slo
    rules:
    - record: agent:slo_error_ratio:rate5m
      expr: sum(rate(agent_requests_total{outcome!="success"}[5m])) / sum(rate(agent_requests_total[5m]))
    - record: agent:slo_error_ratio:rate30m
      expr: sum(rate(agent_requests_total{outcome!="success"}[30m])) / sum(rate(agent_requests_total[30m]))
    - record: agent:slo_error_ratio:rate1h
      expr: sum(rate(agent_requests_total{outcome!="success"}[1h])) / sum(rate(agent_requests_total[1h]))
    - record: agent:slo_error_ratio:rate6h
      expr: sum(rate(agent_requests_total{outcome!="success"}[6h])) / sum(rate(agent_requests_total[6h]))
